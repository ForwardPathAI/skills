reviews:
  profile: quiet
  auto_review:
    enabled: false
  path_instructions:
    - path: "**"
      instructions: |
        When a review is explicitly requested, report only actionable correctness, security, reliability, or compatibility issues introduced by the change. Skip style preferences, speculative risks, and issues without a concrete failure scenario. Keep findings concise and cite the affected code. Do not identify or name other review agents; independent reviewers may be used separately.
