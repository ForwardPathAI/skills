name: Skill naming

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  skill-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Lint skill names
        run: python3 scripts/lint_skill_names.py
      - name: Test naming checks
        run: python3 -m unittest discover -s tests -p 'test_skill_names.py'
