name: Skill naming

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  skill-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint skill names
        run: python3 scripts/lint_skill_names.py
      - name: Test naming checks
        run: python3 -m unittest discover -s tests -p 'test_skill_names.py'
